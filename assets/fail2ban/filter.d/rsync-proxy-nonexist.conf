[Definition]

# A record in access.log looks like
#   2026/11/19 04:49:30 server.go:904: client 192.0.2.1 requests non-existing module "foo"
# fail2ban strips the timestamp; the expression is then anchored on the
# "<file>.go:<line>: " prefix that rsync-proxy itself writes, so text supplied
# by a client (the module name) can never be taken for the start of a record,
# neither here nor by rsync-proxy-connection.conf.
# <ADDR> instead of <HOST>: rsync-proxy only ever logs addresses, and names
# taken from a log line must not be resolved through DNS.
failregex = ^\s*\S+\.go:\d+: client <ADDR> requests non-existing module\s
