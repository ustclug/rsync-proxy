# Example configuration file for rsync-proxy

[proxy]
listen = "0.0.0.0:873"
listen_tls = "0.0.0.0:874"
listen_http = "/run/rsync-proxy/rsync-proxy.sock"
access_log = "/var/log/rsync-proxy/access.log"
# Optional JSON Lines access log for rsync connections.
#access_json_log = "/var/log/rsync-proxy/access.json.log"
error_log = "/var/log/rsync-proxy/error.log"
tls_cert_file = "/etc/rsync-proxy/tls/server.crt"
tls_key_file = "/etc/rsync-proxy/tls/server.key"

motd = "Served by rsync-proxy (https://github.com/ustclug/rsync-proxy)"

# Idle timeout (seconds) applied during the bidirectional relay phase
# of a client connection. If no data flows in either direction for
# this duration, the connection is terminated. 0 (the default)
# disables the timeout, mirroring rsyncd's "timeout = 0" semantics in
# rsyncd.conf(5). For public mirrors, 600 (10 minutes) is a common
# starting value.
#relay_idle_timeout = 0

# Hard upper bound (seconds) on the total wall-clock duration of the
# bidirectional relay phase. When exceeded the proxy closes the
# connection regardless of activity. rsync does not automatically
# reconnect; retrying or resuming depends on how the caller invokes
# it (e.g. a script or cron job). 0 (the default) disables this cap.
# For public mirrors, 14400 (4h) bounds the worst case while still
# accommodating large initial syncs.
#relay_max_duration = 0

# TCP keepalive period (seconds) applied to accepted client
# connections and dialed upstream connections. Helps detect
# half-open connections (peer crashed, NAT entry reaped) within
# minutes rather than the OS default (~2 hours). 0 (the default)
# leaves the OS-default keepalive behavior in place. A typical value
# is 120 (2 minutes).
#tcp_keepalive = 0

# Default per-IP per-upstream concurrent active connection cap.
# Limits how many simultaneous active relay connections a single
# client IP may have to any one upstream, preventing a single client
# from monopolizing upstream slots. 0 (the default) disables the
# limit. A typical value for public mirrors is 4. Each upstream may
# override this via its own per_ip_max_active_connections setting
# below. Be cautious when many legitimate clients share a single
# egress IP (NAT, campus networks): set the cap large enough to
# accommodate them. IPv6 clients are counted per /64 (one host or
# customer routinely controls a whole /64), IPv4 clients per address.
#per_ip_max_active_connections = 0

# Connect timeout (seconds) when dialing upstreams. Bounds how long
# the proxy waits for an unresponsive upstream before failing fast
# and incrementing rsync_proxy_upstream_dial_errors_total. 0 (the
# default) leaves the OS connect-attempt behavior in place
# (typically ~75s of SYN retries on Linux). For LAN upstreams a
# short value such as 5 fails fast without keeping the slot tied up.
#dial_timeout = 0

# Throughput floor enforced during the relay phase. A connection
# that transfers fewer than min_throughput_bytes (counting both
# directions) over the most recent min_throughput_window seconds is
# treated as slow-leeching and terminated. Set min_throughput_bytes
# to 0 (the default) to disable the check.
#
# Choosing values: the effective floor is
# min_throughput_bytes / min_throughput_window. A short window reacts
# quickly but also raises the effective rate and is easily tripped by
# a client that merely stalls for one window; a longer window smooths
# transient stalls and lowers the rate. For a public mirror,
# 1048576 (1 MiB) over 300 (5 minutes) works out to ~3.4 KiB/s
# averaged over 5 minutes, which still terminates genuinely stalled
# clients (most offenders transfer only a few hundred bytes per
# minute) while sparing slow-but-legitimate ones. Avoid combining
# 1 MiB with the 60s default, which is ~17.5 KiB/s and has been
# observed to kill real transfers.
#
# min_throughput_grace exempts a fresh connection from the floor for
# this many seconds; no measurement is taken during the grace period,
# and the first sampling window starts only after it ends. This
# matters because rsync's initial file-list phase can take many
# minutes for very large modules (millions of files), during which
# the apparent throughput is low. Defaults to min_throughput_window
# when unset. Typical starting values:
# bytes = 1048576 (1 MiB), window = 300, grace = 600.
#min_throughput_bytes = 0
#min_throughput_window = 300
#min_throughput_grace = 600

[upstreams.u1]
address = "127.0.0.1:1234"
modules = ["foo"]
# When using queueing, set rsyncd's "max connections = 0" for the
# corresponding modules and let the proxy limit concurrency.
# rsyncd may still hold a connection-count lock after the proxy
# releases a slot, so matching limits can reject a queued client
# with "max connections reached". Direct connections to rsyncd
# bypass the proxy's limit.
max_active_connections = 60
max_queued_connections = 60
# Override the proxy-wide per_ip_max_active_connections for this
# upstream. 0 means inherit the proxy-wide default.
#per_ip_max_active_connections = 4

[upstreams.u1_auto]
address = "127.0.0.1:1234"
# If upstream is not available when discover_modules is true, rsync-proxy refuses to start/reload.
discover_modules = true

[upstreams.u2]
address = "192.168.0.10:1235"
# Modules that multiple upstreams provide would be load-balanced by client IP.
modules = ["bar", "foo"]

[upstreams.u3]
address = "rsync.example.internal:1235"
modules = ["baz"]

[upstreams.u4]
address = "rsync.example.internal:1236"
modules = ["pro"]
# This option requires rsync upstream to support and enable proxy protocol
# See: https://github.com/WayneD/rsync/blob/2f9b963abaa52e44891180fe6c0d1c2219f6686d/rsyncd.conf.5.md?plain=1#L268
use_proxy_protocol = true

[upstreams.5]
# Rsync does not natively support Unix sockets, so you must run Rsync from xinetd or systemd.socket (with Accept=yes)
address = "/run/rsyncd.sock"
modules = ["max"]
use_proxy_protocol = true
